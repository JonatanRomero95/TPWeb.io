<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500;1,100&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header-container">
        <a href="index.html"><img src="imagenes/logo_main-1.png" alt="imagen-logo" width="200" height="100"></a>
        <h1>¡Cine en Casa: Descubre<br> el Mundo del Cine!</h1>
    </header>
    <section>
        <article class="contenedor_login">
            <form action="" id="form" method="POST" novalidate>
                <div class="form">
                    <h1>Ingreso</h1>
                    <div class="grupo">
                        <input type="text" name="nombre" id="name" placeholder="Ingresa tu nombre" required><span class="barra"></span>
                        <label for="name">Nombre</label>
                    </div>
                    <div class="grupo">
                        <input type="email" name="email" id="email" placeholder="correo@ejemplo.com" required><span class="barra"></span>
                        <label for="email">Email</label>
                    </div>
                    <div class="grupo">
                        <input type="password" name="password" id="password" placeholder="Minimo 6 caracteres" required><span class="barra"></span>
                        <label for="password">Password</label>
                    </div>
                    <button class="button" type="submit">Ingresar</button>
                </div>
            </form>
        </article>
        <script src="formulario.js"></script>
    </section>
    <footer class="footer-container">
        <a href="index.html"><img src="imagenes/logo_main-1.png" alt="imagen-logo" width="200" height="100"></a>
        <a href="#"><h3>Volver al inicio</h3></a>
    </footer>
</body>

</html>
